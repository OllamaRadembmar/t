# ============================================================================
#  BlogTube · fuentes
#  Este es el único archivo que necesitas tocar para añadir/quitar contenido.
#  Después ejecuta:  python build.py   (o deja que GitHub Actions lo haga solo)
#
#  peso   = cuánto aparece una fuente en el feed "Para ti" (1 = poco … 5 = mucho)
#  temas  = núcleos temáticos por defecto de la fuente (ver [[tema]] abajo).
#           Además, cada vídeo/artículo se etiqueta solo por palabras clave.
#  lang   = idioma en que YouTube devuelve los títulos ("es" o "en").
# ============================================================================

[site]
title = "BlogTube"
tagline = "Vídeos y lecturas que merecen la pena. Sin algoritmo, sin prisa."

# Vídeos que NO se muestran (los Shorts de YouTube ya se excluyen siempre):
#  - más cortos que duracion_minima (en minutos). Un canal puede tener su propio
#    valor poniendo  duracion_minima = N  dentro de su bloque [[canal]].
#  - con alguna de estas palabras COMPLETAS en el título (sin acentos ni mayúsculas;
#    "promo" no quita "promoción").
duracion_minima = 5
excluir_titulos = ["trailer", "teaser", "promo"]

# ---------------------------------------------------------------------------
#  Núcleos temáticos (chips de filtro). Las palabras clave se comparan sin
#  acentos y en minúsculas contra título + subtítulo. Por defecto cuentan como
#  comienzo de palabra ("filosof" → filosofía); con "$" al final, palabra completa.
# ---------------------------------------------------------------------------
[[tema]]
name = "Filosofía"
color = "#c58cff"
keywords = ["filosofia", "filosofo", "philosophy", "metafisica", "ontologia", "epistemolog", "etica", "nietzsche", "heidegger", "kant", "hegel", "platon", "aristoteles", "spinoza", "wittgenstein", "estoic", "existencial", "consciencia", "consciousness", "idealismo", "fenomenolog", "kastrup", "schopenhauer"]

[[tema]]
