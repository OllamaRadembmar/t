name: Actualizar y publicar

on:
  schedule:
    - cron: "0 5 * * 1"        # cada lunes a las 05:00 UTC (no hace falta más: no hay prisa)
  workflow_dispatch:
    inputs:
      full:
        description: "Volver a listar el historial completo de los canales"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["sources.toml", "site/index.html", "build.py", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Descargar fuentes
        run: python build.py ${{ github.event.inputs.full == 'true' && '--full' || '' }}
        continue-on-error: true   # si YouTube o Substack fallan, se publica lo que ya había en cache/
      - name: Recomponer desde cache (por si el paso anterior falló a medias)
        run: python build.py --offline
      - name: Comprobar que no se publica ningún texto íntegro
        run: |
          test ! -d site/data/a || test -z "$(ls -A site/data/a)"
          python -c "import json; assert not json.load(open('site/data/meta.json')).get('textos')"
      - name: Guardar cache (solo metadatos) en el repo
        run: |
          git config user.name "blogtube-bot"
          git config user.email "blogtube-bot@users.noreply.github.com"
          git add cache
          git diff --cached --quiet || git commit -m "Actualizar contenido $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
