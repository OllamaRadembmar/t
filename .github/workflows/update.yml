name: Actualizar y publicar

# Construye la web en GitHub (repo privado) y la publica en Cloudflare Pages,
# protegida con Cloudflare Access (ver access.yml). Secretos necesarios:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  schedule:
    - cron: "0 5 * * 1"        # cada lunes a las 05:00 UTC (no hace falta más: no hay prisa)
  workflow_dispatch:
    inputs:
      full:
        description: "Volver a listar el historial completo de los canales"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["sources.toml", "site/index.html", "build.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Descargar fuentes
        run: python build.py ${{ github.event.inputs.full == 'true' && '--full' || '' }}
        continue-on-error: true   # si YouTube o Substack fallan, se publica lo que ya había en cache/
      - name: Recomponer desde cache (por si el paso anterior falló a medias)
        run: python build.py --offline

      - name: Guardar cache (solo metadatos) en el repo
        run: |
          git config user.name "blogtube-bot"
          git config user.email "blogtube-bot@users.noreply.github.com"
          git add cache
          git diff --cached --quiet || git commit -m "Actualizar contenido $(date -u +%Y-%m-%d)"
          git push

      - name: Crear el proyecto de Cloudflare Pages (solo la primera vez)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create blogtube --production-branch=main

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=blogtube --branch=main --commit-dirty=true
